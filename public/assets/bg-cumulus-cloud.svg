<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" shape-rendering="crispEdges">
  <!-- Cụm mây Pixel Art khổng lồ có thể tích và bóng đổ (Volumetric Pixel Cumulus) -->
  <!-- Nguồn sáng: Góc trên bên trái (Top-Left Sunlight) -->

  <!-- 1. Vùng bóng râm chân mây sâu (Deep Ambient Cloud Shadow) -->
  <g fill="#7c9abc">
    <rect x="220" y="380" width="360" height="80" />
    <rect x="180" y="410" width="440" height="80" />
    <rect x="140" y="440" width="520" height="70" />
    <rect x="100" y="470" width="600" height="60" />
    <rect x="80" y="500" width="640" height="50" />
  </g>

  <!-- 2. Vùng bóng mây lam tím tự nhiên (Cloud Shadow Midtone) -->
  <g fill="#9cb7d6">
    <rect x="230" y="320" width="340" height="100" />
    <rect x="180" y="350" width="420" height="100" />
    <rect x="140" y="380" width="500" height="100" />
    <rect x="110" y="420" width="560" height="90" />
    <rect x="280" y="240" width="260" height="120" />
    <rect x="360" y="180" width="160" height="100" />
  </g>

  <!-- 3. Thân mây xốp trung gian (Cloud Midtone) -->
  <g fill="#d8e5f3">
    <rect x="240" y="290" width="310" height="100" />
    <rect x="190" y="330" width="390" height="100" />
    <rect x="150" y="360" width="460" height="90" />
    <rect x="270" y="210" width="240" height="110" />
    <rect x="330" y="140" width="160" height="100" />
    <rect x="370" y="90" width="110" height="80" />
  </g>

  <!-- 4. Lớp mây sáng mịn (Soft Cloud Highlight) -->
  <g fill="#edf4fa">
    <rect x="250" y="260" width="280" height="90" />
    <rect x="200" y="300" width="360" height="90" />
    <rect x="160" y="340" width="420" height="80" />
    <rect x="280" y="180" width="210" height="100" />
    <rect x="340" y="120" width="130" height="90" />
    <rect x="380" y="70" width="80" height="80" />
  </g>

  <!-- 5. Vùng đỉnh mây đón trọn vẹn ánh nắng mặt trời (Sunlit Top Highlight) -->
  <g fill="#ffffff">
    <rect x="260" y="240" width="220" height="80" />
    <rect x="210" y="280" width="310" height="80" />
    <rect x="170" y="320" width="360" height="70" />
    <rect x="290" y="160" width="170" height="90" />
    <rect x="340" y="100" width="110" height="80" />
    <rect x="380" y="50" width="70" height="70" />
    <rect x="390" y="30" width="50" height="40" />
  </g>

  <!-- 6. Viền nắng ấm mai vàng chiếu rọi (Warm Sun Rim Highlight) -->
  <g fill="#fffdf2">
    <rect x="390" y="20" width="40" height="20" />
    <rect x="340" y="90" width="50" height="20" />
    <rect x="290" y="150" width="50" height="20" />
    <rect x="210" y="270" width="60" height="20" />
    <rect x="170" y="310" width="50" height="20" />
  </g>
</svg>
