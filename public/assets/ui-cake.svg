<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" shape-rendering="crispEdges">
  <!-- Đĩa sứ đựng bánh mộc mạc -->
  <rect x="12" y="142" width="156" height="12" fill="#f4efe4" stroke="#2b3d4f" stroke-width="2" rx="2" />
  <rect x="14" y="144" width="152" height="4" fill="#ffffff" />

  <!-- Tầng bánh dưới (Vani bơ ấm) -->
  <rect x="24" y="96" width="132" height="48" fill="#f5ebd3" stroke="#2b3d4f" stroke-width="2" />
  <!-- Mảng bóng đổ tầng dưới -->
  <rect x="26" y="132" width="128" height="10" fill="#e5d4b5" />
  <!-- Lớp kem sữa tươi phủ tầng dưới -->
  <rect x="24" y="96" width="132" height="14" fill="#ffffff" />
  <rect x="36" y="110" width="8" height="6" fill="#ffffff" />
  <rect x="68" y="110" width="10" height="8" fill="#ffffff" />
  <rect x="108" y="110" width="8" height="5" fill="#ffffff" />
  <rect x="134" y="110" width="10" height="7" fill="#ffffff" />

  <!-- Tầng bánh trên -->
  <rect x="42" y="58" width="96" height="40" fill="#fdf6e4" stroke="#2b3d4f" stroke-width="2" />
  <!-- Mảng bóng đổ tầng trên -->
  <rect x="44" y="86" width="92" height="10" fill="#ebdcb9" />
  <!-- Lớp kem sữa tươi phủ tầng trên -->
  <rect x="42" y="58" width="96" height="12" fill="#ffffff" />
  <rect x="52" y="70" width="8" height="5" fill="#ffffff" />
  <rect x="86" y="70" width="8" height="7" fill="#ffffff" />
  <rect x="118" y="70" width="8" height="5" fill="#ffffff" />

  <!-- Quả dâu rừng mọng nước tự nhiên trên mặt bánh -->
  <!-- Dâu 1 -->
  <rect x="50" y="48" width="12" height="12" fill="#c2495d" stroke="#2b3d4f" stroke-width="1.5" />
  <rect x="53" y="45" width="6" height="4" fill="#4d7a5b" />
  <!-- Dâu 2 -->
  <rect x="84" y="48" width="12" height="12" fill="#c2495d" stroke="#2b3d4f" stroke-width="1.5" />
  <rect x="87" y="45" width="6" height="4" fill="#4d7a5b" />
  <!-- Dâu 3 -->
  <rect x="118" y="48" width="12" height="12" fill="#c2495d" stroke="#2b3d4f" stroke-width="1.5" />
  <rect x="121" y="45" width="6" height="4" fill="#4d7a5b" />

  <!-- Cây nến sinh nhật kẻ sọc pixel -->
  <rect x="84" y="16" width="12" height="34" fill="#ffffff" stroke="#2b3d4f" stroke-width="1.5" />
  <rect x="84" y="22" width="12" height="4" fill="#689bd2" />
  <rect x="84" y="30" width="12" height="4" fill="#689bd2" />
  <rect x="84" y="38" width="12" height="4" fill="#689bd2" />
  <!-- Tim nến -->
  <rect x="89" y="11" width="2" height="5" fill="#362920" />

  <!-- Ngọn lửa 8-bit ấm áp bập bùng -->
  <rect x="83" y="-3" width="14" height="16" fill="#f97316" rx="4" />
  <rect x="85" y="-1" width="10" height="12" fill="#fde047" rx="3" />
  <rect x="87" y="3" width="6" height="6" fill="#ffffff" rx="1" />
</svg>
