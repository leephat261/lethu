<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" shape-rendering="crispEdges">
  <!-- Bóng đổ rương dưới đất -->
  <rect x="15" y="122" width="110" height="10" fill="#243342" opacity="0.25" rx="5" />

  <!-- Thân rương gỗ mộc -->
  <rect x="20" y="58" width="100" height="64" fill="#6a5240" stroke="#362920" stroke-width="3" />
  <!-- Vân gỗ & mảng sáng thân rương -->
  <rect x="23" y="61" width="94" height="8" fill="#846852" />
  <rect x="23" y="112" width="94" height="7" fill="#4d3a2d" />

  <!-- Ruy băng vải dệt màu hồng hoa dại dọc thân -->
  <rect x="58" y="58" width="24" height="64" fill="#d9758f" stroke="#2b3d4f" stroke-width="2" />
  <rect x="62" y="58" width="16" height="64" fill="#e89eb0" />

  <!-- Ruy băng vải dệt ngang thân -->
  <rect x="20" y="84" width="100" height="20" fill="#d9758f" stroke="#2b3d4f" stroke-width="2" />
  <rect x="20" y="88" width="100" height="12" fill="#e89eb0" />

  <!-- Khóa đồng thau ở giao điểm ruy băng -->
  <rect x="60" y="86" width="20" height="16" fill="#f0cb69" stroke="#362920" stroke-width="2" />
  <rect x="67" y="91" width="6" height="6" fill="#785f4c" />

  <!-- Nắp rương gỗ mộc -->
  <rect x="14" y="32" width="112" height="30" fill="#7c614b" stroke="#362920" stroke-width="3" />
  <!-- Gờ nắp đón nắng -->
  <rect x="17" y="35" width="106" height="6" fill="#9e8067" />
  <!-- Ruy băng trên nắp -->
  <rect x="58" y="32" width="24" height="30" fill="#d9758f" stroke="#2b3d4f" stroke-width="2" />
  <rect x="62" y="32" width="16" height="30" fill="#e89eb0" />

  <!-- Nơ vải dệt thủ công ở đỉnh rương -->
  <!-- Cánh nơ trái -->
  <rect x="36" y="12" width="28" height="24" fill="#d9758f" stroke="#2b3d4f" stroke-width="2" transform="rotate(-15 36 12)" />
  <rect x="42" y="16" width="16" height="16" fill="#e89eb0" transform="rotate(-15 42 16)" />
  <!-- Cánh nơ phải -->
  <rect x="76" y="12" width="28" height="24" fill="#d9758f" stroke="#2b3d4f" stroke-width="2" transform="rotate(15 76 12)" />
  <rect x="82" y="16" width="16" height="16" fill="#e89eb0" transform="rotate(15 82 16)" />
  <!-- Nút thắt nơ tâm giữa -->
  <rect x="61" y="18" width="18" height="18" fill="#f0cb69" stroke="#362920" stroke-width="2" />
  <rect x="65" y="22" width="10" height="10" fill="#fffdf2" />
</svg>
