<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 324" width="576" height="324" shape-rendering="crispEdges">
  <!-- =========================================================================
       PHƯƠNG ÁN 1: SUMMER PIXEL ART BACKGROUND — LAYER 2: CUMULUS CLOUDS (CRAFTPIX)
       Resolution: 576 x 324 px | Volumetric Pixel Cumulus with Sunlight Rim & Shadows
       ========================================================================= -->

  <!-- CỤM MÂY CHÍNH KHỔNG LỒ TẬP TRUNG Ở PHÍA TRÊN BÊN PHẢI (MAIN GIANT CUMULUS) -->
  <g id="giant-summer-cloud">
    <!-- 1. Lớp bóng râm chân mây sâu nhất (Deep Atmospheric Base Shadow: #6d93bd) -->
    <g fill="#6d93bd">
      <rect x="220" y="142" width="230" height="26" />
      <rect x="200" y="152" width="260" height="24" />
      <rect x="180" y="166" width="290" height="18" />
    </g>

    <!-- 2. Lớp bóng mây lam tím tự nhiên (Cloud Midtone Shadow: #92b6db) -->
    <g fill="#92b6db">
      <rect x="240" y="112" width="190" height="34" />
      <rect x="210" y="130" width="240" height="30" />
      <rect x="190" y="146" width="270" height="22" />
      <rect x="310" y="74" width="120" height="42" />
      <rect x="350" y="46" width="70" height="36" />
      <rect x="180" y="118" width="70" height="32" />
    </g>

    <!-- 3. Lớp thân mây xốp chuyển tiếp (Soft Cloud Ambient: #cde1f4) -->
    <g fill="#cde1f4">
      <rect x="230" y="96" width="190" height="40" />
      <rect x="200" y="116" width="240" height="36" />
      <rect x="170" y="132" width="280" height="30" />
      <rect x="290" y="60" width="130" height="46" />
      <rect x="330" y="32" width="80" height="40" />
      <rect x="160" y="104" width="80" height="34" />
    </g>

    <!-- 4. Lớp thân mây trắng sáng (Pure Cloud Body: #f4f8fd) -->
    <g fill="#f4f8fd">
      <rect x="220" y="80" width="180" height="44" />
      <rect x="190" y="102" width="230" height="36" />
      <rect x="160" y="118" width="270" height="30" />
      <rect x="280" y="46" width="120" height="46" />
      <rect x="320" y="20" width="80" height="40" />
      <rect x="150" y="90" width="80" height="36" />
    </g>

    <!-- 5. Lớp đỉnh mây đón trọn vẹn nắng hè (Top Sunlit Highlights: #ffffff) -->
    <g fill="#ffffff">
      <rect x="210" y="72" width="150" height="34" />
      <rect x="180" y="92" width="200" height="32" />
      <rect x="150" y="110" width="240" height="24" />
      <rect x="270" y="38" width="110" height="38" />
      <rect x="310" y="14" width="74" height="32" />
      <rect x="140" y="82" width="70" height="30" />
      <rect x="324" y="8" width="46" height="12" />
    </g>

    <!-- 6. Viền nắng vàng mật ong ấm áp rọi vào đỉnh mây (Warm Sunlight Rim: #fffef2) -->
    <g fill="#fffef2">
      <rect x="326" y="6" width="40" height="4" />
      <rect x="312" y="12" width="20" height="4" />
      <rect x="274" y="34" width="28" height="4" />
      <rect x="142" y="80" width="24" height="4" />
      <rect x="212" y="68" width="30" height="4" />
    </g>
  </g>

  <!-- CỤM MÂY NHỎ LƯỚT PHÍA TÂY (WEST DRIFTING CUMULUS) -->
  <g id="west-drifting-cloud" opacity="0.88">
    <g fill="#82a8d1">
      <rect x="32" y="130" width="94" height="16" />
      <rect x="20" y="138" width="114" height="12" />
    </g>
    <g fill="#c1daf2">
      <rect x="34" y="118" width="84" height="16" />
      <rect x="24" y="126" width="100" height="14" />
      <rect x="52" y="98" width="50" height="24" />
    </g>
    <g fill="#ffffff">
      <rect x="36" y="110" width="76" height="16" />
      <rect x="50" y="92" width="46" height="20" />
      <rect x="58" y="86" width="30" height="10" />
    </g>
    <rect x="60" y="84" width="24" height="4" fill="#fffef2" />
  </g>

  <!-- MÂY TẦNG CAO LƠ LỬNG (HIGH ALTITUDE PUFF) -->
  <g id="high-cloud-puff" opacity="0.8">
    <g fill="#9abde0">
      <rect x="440" y="92" width="80" height="10" />
    </g>
    <g fill="#dbecfa">
      <rect x="444" y="82" width="72" height="12" />
      <rect x="460" y="72" width="40" height="14" />
    </g>
    <g fill="#ffffff">
      <rect x="448" y="78" width="62" height="10" />
      <rect x="464" y="68" width="32" height="10" />
    </g>
  </g>
</svg>
