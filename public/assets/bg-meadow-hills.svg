       TRIỀN ĐỒI CỎ XÔ THƠM & CÁNH ĐỒNG HOA DẠI HỒNG (SAGE MEADOW & WILDFLOWERS)
       Lấy cảm hứng trực tiếp từ bức tranh tham khảo
       ========================================================================= -->

  <!-- Lớp đồi sau (Bóng râm đồi cỏ xa xanh sẫm) -->
  <path d="M0,120 Q300,50 650,90 T1200,60 L1200,320 L0,320 Z" fill="#2d523b" />
  <path d="M0,140 Q320,65 680,105 T1200,75 L1200,320 L0,320 Z" fill="#264732" />

  <!-- Lớp đồi trung cảnh (Sage Green nhấp nhô) -->
